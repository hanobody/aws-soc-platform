apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-soc-api-reader
  namespace: soc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-soc-api-reader
  namespace: soc
subjects:
  - kind: ServiceAccount
    name: aws-soc-api
    namespace: soc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-soc-api-reader
