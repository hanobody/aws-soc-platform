apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-soc-api
  namespace: aws-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws-soc-api
  template:
    metadata:
      labels:
        app: aws-soc-api
    spec:
      serviceAccountName: aws-soc-api
      containers:
        - name: api
          image: your-registry/aws-soc-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: CORS_ORIGIN
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: AWS_REGION
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: SQS_QUEUE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aws-soc-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
