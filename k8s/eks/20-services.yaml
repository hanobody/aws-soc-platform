apiVersion: v1
kind: Service
metadata:
  name: aws-soc-api
  namespace: soc
spec:
  type: ClusterIP
  selector:
    app: aws-soc-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aws-soc-web
  namespace: soc
spec:
  type: ClusterIP
  selector:
    app: aws-soc-web
  ports:
    - name: http
      port: 80
      targetPort: http
