apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-soc-ingest-worker
  namespace: aws-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aws-soc-ingest-worker
  template:
    metadata:
      labels:
        app: aws-soc-ingest-worker
    spec:
      serviceAccountName: aws-soc-ingest-worker
      containers:
        - name: ingest-worker
          image: your-registry/aws-soc-ingest-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: AWS_REGION
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: SQS_QUEUE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aws-soc-secrets
                  key: DATABASE_URL
            - name: WORKER_NAME
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: INGEST_WORKER_NAME
            - name: SQS_MAX_MESSAGES
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: SQS_MAX_MESSAGES
            - name: SQS_WAIT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: SQS_WAIT_SECONDS
            - name: SQS_VISIBILITY_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: aws-soc-config
                  key: SQS_VISIBILITY_TIMEOUT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
